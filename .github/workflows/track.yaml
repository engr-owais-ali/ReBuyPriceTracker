name: Track Rebuy Prices

on:
  schedule:
    # Runs at 08:00, 13:00, 18:00, and 23:00 UTC
    - cron: '0 8,13,18,23 * * *'
  workflow_dispatch: # Allows you to click a button to run it manually

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required so the bot can push the database to the repo

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Tracker
        run: python tracker.py

      - name: Commit and Push DB Updates
        run: |
          git config --global user.name "Rebuy Tracker Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data/rebuy_prices.db
          # The || echo ensures the workflow doesn't fail if prices haven't updated yet
          git commit -m "Update price history [skip ci]" || echo "No changes to commit"
          git push